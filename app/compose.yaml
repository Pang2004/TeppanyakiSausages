services:
  fleet-diagnostic:
    build:
      context: .
      dockerfile: Dockerfile
    image: fleet-diagnostic:local
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      RAIL_MAX_FILE_BYTES: "${RAIL_MAX_FILE_BYTES:-67108864}"
      PORT: "8080"
    cpus: "${APP_CPUS:-2.0}"
    mem_limit: "${APP_MEMORY:-2g}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)); assert all(h.get('subsystems', {}).get(k) for k in ('rail', 'door', 'acv', 'shm'))"
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 45s
